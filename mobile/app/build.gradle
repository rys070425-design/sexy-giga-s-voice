plugins { id 'com.android.application' }
android {
    namespace 'io.github.rys070425design.universalvoicemobile'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.rys070425design.universalvoicemobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('UVKR_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('UVKR_ANDROID_KEYSTORE'))
                storePassword System.getenv('UVKR_ANDROID_STORE_PASSWORD')
                keyAlias 'universal-voice'
                keyPassword System.getenv('UVKR_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    bundle { language { enableSplit = false } }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
